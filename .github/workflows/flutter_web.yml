name: Flutter Web Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build course and adventure
        env:
          GAME_SERVER_WS_URL: ${{ vars.GAME_SERVER_WS_URL }}
        run: |
          if [ -n "$GAME_SERVER_WS_URL" ]; then
            flutter build web --release --base-href="/umt3033_flutter/" --no-web-resources-cdn --dart-define="GAME_SERVER_WS_URL=$GAME_SERVER_WS_URL"
          else
            flutter build web --release --base-href="/umt3033_flutter/" --no-web-resources-cdn
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
