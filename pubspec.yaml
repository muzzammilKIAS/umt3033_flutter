name: umt3033_app
description: "Basic Arabic for Muamalat — UMT3033 — Modul pembelajaran interaktif Bahasa Arab untuk Muamalat, KIAS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4
  just_audio: ^0.9.42
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.2
  provider: ^6.1.2
  flame: ^1.38.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_database: ^12.6.0
  qr_flutter: ^4.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/amiri/Amiri-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-VariableFont.ttf

  assets:
    - assets/data/
    - assets/images/
    - assets/images/units/
    - assets/audio/unit-01/male/
    - assets/audio/unit-01/female/
    - assets/audio/unit-02/male/
    - assets/audio/unit-03/male/
    - assets/audio/unit-03/female/
    - assets/audio/unit-04/male/
    - assets/audio/unit-05/male/
    - assets/audio/unit-06/male/
    - assets/audio/unit-06/female/
    - assets/audio/unit-07/male/
    - assets/audio/unit-07/female/
    - assets/audio/unit-08/male/
    - assets/audio/unit-08/female/
    - assets/audio/unit-09/male/
    - assets/audio/unit-10/male/
    - assets/audio/unit-10/female/
    - assets/audio/unit-11/male/
    - assets/audio/unit-12/male/
    - assets/audio/unit-12/female/
    - assets/audio/unit-13/male/
    - assets/audio/unit-14/male/
    - assets/audio/unit-14/female/
