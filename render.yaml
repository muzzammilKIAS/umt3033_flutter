# Render blueprint for the UMT3033 course app + Arabic Muamalat Adventure.
# Two services: the Flutter web static site, and the standalone Dart
# WebSocket game server that replaces Firebase for live classroom
# multiplayer. Rooms live in the server's memory only -- no database.
services:
  - type: web
    name: umt3033-adventure
    runtime: static
    buildCommand: ./tools/render_build.sh
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_VERSION
        value: 3.44.8
      # Served at the domain root on Render, unlike the GitHub Pages sub-path.
      - key: BASE_HREF
        value: /
      # wss://<game server's Render URL>/ws -- fill in once the game server
      # service below has deployed and you have its onrender.com hostname.
      - key: GAME_SERVER_WS_URL
        sync: false

  - type: web
    name: umt3033-adventure-server
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
    healthCheckPath: /healthz
